version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: peertube

build:
  toolchains: []
  run_buildscript: false

images:
  - id: peertube
    target: service
    service: peertube
    source: docker.io/chocobozzz/peertube
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: PeerTube
    summary: ActivityPub-federated video streaming platform using P2P directly in your web browser
