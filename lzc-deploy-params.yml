params:
  - id: admin_email
    type: string
    name: Administrator Email
    description: Email address for the initial PeerTube root administrator
    optional: false

  - id: admin_password
    type: secret
    name: Administrator Password
    description: Initial password for the PeerTube root account; changing this value after first installation does not reset an existing account
    default_value: "$random(len=24)"
    optional: false

  - id: use_document_storage
    type: bool
    name: Use Document Storage
    description: Store large video and caption files in a selected LazyCat user's private documents; internal application data remains in application storage
    default_value: "false"
    optional: true

  - id: storage_owner
    type: lzc_uid
    name: Storage Owner
    description: LazyCat user that owns the PeerTube document-storage directory; select a user when document storage is enabled
    optional: true

locales:
