params:
  - id: admin_email
    type: string
    name: Administrator Email
    description: Email address for the initial PeerTube root administrator
    optional: false

  - id: admin_password
    type: secret
    name: Administrator Password
    description: Initial password for the PeerTube root account; changing this value after first installation does not reset an existing account
    default_value: "$random(len=24)"
    optional: false

  - id: document_storage_owner
    type: lzc_uid
    name: Optional Document Storage
    description: Optionally select a LazyCat user to store large video and caption files in private documents; leave empty to use internal application storage, and note that changing this later does not migrate existing files
    optional: true

locales:
  zh:
    admin_email:
      name: 管理员邮箱
      description: PeerTube 初始 root 管理员的邮箱地址
    admin_password:
      name: 管理员密码
      description: PeerTube root 账号的初始密码；首次安装后修改此参数不会重置已有账号密码
    document_storage_owner:
      name: 可选文稿存储
      description: 可选择一个 LazyCat 用户，将大型视频和字幕文件保存到其私有文稿；留空则使用应用内部存储，后续改变此项不会自动迁移已有文件
