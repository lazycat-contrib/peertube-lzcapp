application:
  subdomain: peertube
  multi_instance: false
  upstreams:
    - location: /
      backend: http://peertube:9000/
  public_path:
    - /
  ingress:
    - protocol: tcp
      publish_port: 1935
      service: peertube
      port: 1935
  injects:
    - id: peertube-login
      on: browser
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: root
            password: "{{ .U.admin_password }}"
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js

services:
  peertube:
    # upstream: docker.io/chocobozzz/peertube:v8.2.4
    image: docker.1ms.run/chocobozzz/peertube:v8.2.4
    environment:
      - PEERTUBE_DB_USERNAME=peertube
      - PEERTUBE_DB_PASSWORD={{ stable_secret "postgres_password" }}
      - PEERTUBE_DB_SSL=false
      - PEERTUBE_DB_HOSTNAME=postgres
      - PEERTUBE_REDIS_HOSTNAME=redis
      - PEERTUBE_WEBSERVER_HOSTNAME={{ .S.AppDomain }}
      - PEERTUBE_WEBSERVER_PORT=443
      - PEERTUBE_WEBSERVER_HTTPS=true
      - 'PEERTUBE_TRUST_PROXY=["loopback","linklocal","uniquelocal"]'
      - PEERTUBE_SECRET={{ stable_secret "peertube_secret" }}
      - PEERTUBE_SMTP_HOSTNAME=postfix
      - PEERTUBE_SMTP_PORT=25
      - PEERTUBE_SMTP_FROM=noreply@{{ .S.AppDomain }}
      - PEERTUBE_SMTP_TLS=false
      - PEERTUBE_SMTP_DISABLE_STARTTLS=false
      - PEERTUBE_ADMIN_EMAIL={{ .U.admin_email }}
      - PT_INITIAL_ROOT_PASSWORD={{ .U.admin_password }}
    binds:
      - /lzcapp/var/peertube/config:/config
      - /lzcapp/var/peertube/data:/data
{{ with .U.document_storage_owner }}
      - /lzcapp/documents/{{ . }}/PeerTube/web-videos:/data/web-videos
      - /lzcapp/documents/{{ . }}/PeerTube/streaming-playlists:/data/streaming-playlists
      - /lzcapp/documents/{{ . }}/PeerTube/original-video-files:/data/original-video-files
      - /lzcapp/documents/{{ . }}/PeerTube/captions:/data/captions
{{ end }}
    depends_on:
      - postgres
      - redis
      - postfix

  postgres:
    # upstream: docker.io/library/postgres:17-alpine
    image: docker.1ms.run/library/postgres:17.11-alpine
    environment:
      - POSTGRES_USER=peertube
      - POSTGRES_PASSWORD={{ stable_secret "postgres_password" }}
      - POSTGRES_DB=peertube
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data

  redis:
    # upstream: docker.io/library/redis:8-alpine
    image: docker.1ms.run/library/redis:8.10.1-alpine
    binds:
      - /lzcapp/var/redis:/data

  postfix:
    # upstream: docker.io/mwader/postfix-relay:latest
    image: docker.1ms.run/mwader/postfix-relay:latest
    environment:
      - POSTFIX_myhostname={{ .S.AppDomain }}
      - OPENDKIM_DOMAINS={{ .S.AppDomain }}=peertube
      - OPENDKIM_RequireSafeKeys=no
    binds:
      - /lzcapp/var/postfix/opendkim-keys:/etc/opendkim/keys

usage: |
  Open PeerTube and sign in with the root account. The administrator password is configured during installation. RTMP live streaming is exposed on TCP port 1935. Selecting an optional document-storage owner enables document-backed video storage; leaving it empty uses internal storage. Changing the storage option later does not migrate existing files.
